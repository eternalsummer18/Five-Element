    let target = g.placed ? h : freeCenter(g);

      const d = distance(g, h), outer = snapRadius * 1.55, inner = snapRadius * 1.15;

    ? { x: previous.x + (raw.x - previous.x) * smoothing, y: previous.y + (raw.y - previous.y) * smoothing }
    : raw;
  if (previous) {
    const measured = { x: (smooth.x - previous.x) / elapsed, y: (smooth.y - previous.y) / elapsed };
    hand.velocity.x += (measured.x - hand.velocity.x) * .45;
    hand.velocity.y += (measured.y - hand.velocity.y) * .45;
  }
  const predictionMs = 36, maxPrediction = .042;
  const px = clamp(hand.velocity.x * predictionMs, -maxPrediction, maxPrediction);
  const py = clamp(hand.velocity.y * predictionMs, -maxPrediction, maxPrediction);
  palm = { x: clamp(smooth.x + px), y: clamp(smooth.y + py) };
  if (!hand.detected) showCameraTemporarily();
  hand.detected = true; hand.lastSeen = now;
  const world = result.worldLandmarks?.[0], aspect = video.videoWidth / video.videoHeight;
  const metric = valid(world) ? world : points.map(p => ({ x: p.x * aspect, y: p.y, z: p.z * aspect }));
  const amount = gripAmount(metric);
  hand.gripAmount += (amount - hand.gripAmount) * .58;
  const point = { x: palm.x * width, y: palm.y * height };
  hand.intent = clamp((hand.gripAmount - .43) / .25);
  hand.hover = !hand.down && hand.intent > .08 ? nearestGroup(point) : null;

  // 0.68抓取、0.32释放，中间迟滞区保持状态；抓取快，释放更稳。
  const candidate = hand.gripAmount >= .68 ? 'grab' : hand.gripAmount <= .32 ? 'release' : null;
  if (!candidate) { hand.candidate = null; return; }
  if (candidate !== hand.candidate) { hand.candidate = candidate; hand.since = now; }
  const required = candidate === 'grab' ? 90 : 150;
  if (now - hand.since < required) return;
  if (candidate === 'release') {
    hand.armed = true;
    if (hand.down) release(now);
    hand.down = false;
  } else if (hand.armed && !hand.down) {
    hand.down = true;
    held = hand.hover || nearestGroup(point);
    if (!held) hand.down = false;
    hand.hover = null; hand.intent = 0;
  }
}
async function loadModel() {
  if (model) return;
  if (!modelTask) modelTask = (async () => {
    const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
    const { FilesetResolver, HandLandmarker } = await import(`${base}/vision_bundle.mjs`);
    const files = await FilesetResolver.forVisionTasks(`${base}/wasm`);
    const loaded = await HandLandmarker.createFromOptions(files, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'CPU'
      },
      runningMode: 'VIDEO', numHands: 1,
      minHandDetectionConfidence: .55, minHandPresenceConfidence: .55, minTrackingConfidence: .55
    });
    if (disposed) loaded.close(); else model = loaded;
  })().finally(() => { modelTask = null; });
  await modelTask;
}

function setStatus(message) {
  if ($('status').textContent !== message) $('status').textContent = message;
}
async function startCamera() {
  if (starting || running || disposed) return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    setStatus('请通过 HTTPS 或 localhost 打开页面，以使用摄像头。'); return;
  }
  const current = ++session;
  starting = true; $('start').disabled = true; $('start').textContent = '正在连接…'; $('sound').disabled = false;
  setStatus('正在准备手势识别，首次加载需要片刻…');
  let phase = 'model';
  try {
    // 每次重启先释放可能残留的旧轨道，再创建新的 MediaStream。
    stream?.getTracks().forEach(track => track.stop()); stream = null;
    video.pause(); video.srcObject = null; video.hidden = true;
    await loadModel();
    if (current !== session || disposed) return;
    phase = 'camera'; setStatus('请允许使用摄像头，再张开手掌。');
    const camera = await navigator.mediaDevices.getUserMedia({
      audio: false, video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    if (current !== session) { camera.getTracks().forEach(t => t.stop()); return; }
    stream = camera; video.srcObject = camera; video.hidden = false; video.classList.add('visible');
    await video.play();
    if (current !== session) return;
    resetHand(); lastVideoTime = -1; lastInference = -Infinity;
    running = true; $('start').textContent = '开启体验';
    intro.classList.add('hidden'); app.classList.add('running');
    showCameraTemporarily();
  } catch (error) {
    if (current !== session) return;
    const messages = {
      NotAllowedError: '摄像头权限未开启，请允许后重试。',
      NotFoundError: '未找到摄像头，请连接后重试。',
      NotReadableError: '摄像头被占用或不可用，请检查后重试。'
    };
    stopCamera(messages[error.name] || (phase === 'model'
      ? '手势模型加载失败，请检查网络后重新开启。' : '摄像头启动失败，请检查设备后重试。'));
  } finally {
    // 所有启动出口都恢复按钮；模型与音频不会因摄像头失败而销毁。
    if (current === session) {
      starting = false; $('start').disabled = false;
      if (!running) $('start').textContent = '开启体验';
    }
  }
}
async function startExperience() {
  // 点击链中先解锁音频，再独立启动摄像头；未选择音乐时只启用五音反馈。
  audio.start().catch(() => { $('audio-note').textContent = '声音暂不可用，手势体验仍可继续。'; });
  await startCamera();
}
function stopCamera(message = '体验已暂停，点击开启体验继续。') {
  session++; running = false; starting = false; resetHand();
  stream?.getTracks().forEach(track => track.stop()); stream = null;
  clearTimeout(previewTimer); video.classList.remove('visible');
  video.pause(); video.srcObject = null; video.hidden = true;
  $('start').disabled = false; $('start').textContent = '开启体验';
  app.classList.remove('running', 'ready'); intro.classList.remove('hidden');
  setStatus(message);
}
function pauseExperience(message) {
  audio.pauseForExperience();
  stopCamera(message);
}
function statusForFrame(now) {
  if (groups.every(g => g.placed)) return '五行已归位 · 五音和鸣';
  if (!hand.detected) return held ? '手势暂时离开画面' : '请将一只手放入画面';
  if (!hand.armed) return '请张开手掌';
  if (held) return held.successReady ? '张开手掌，完成归位' : `移向${held.name}之印记`;
  if (hand.hover) return `握拳抓取${hand.hover.name}之气`;
  return now < feedbackUntil ? feedback : '握拳抓取';
}
let lastFrame = performance.now();
function frame(now) {
  if (disposed) return;
  const rawDt = Math.max(1, now - lastFrame), dt = clamp(rawDt / 1000, 0, .05); lastFrame = now;
  quality.samples.push(rawDt);
  if (quality.samples.length > 90) quality.samples.shift();
  if (now > quality.nextCheck && quality.samples.length > 45) {
    quality.fps = 1000 / (quality.samples.reduce((a, b) => a + b, 0) / quality.samples.length);
    if (quality.fps < 38) { setBloom(false); setQuality(0); }
    else if (quality.fps < 45) {
      if (quality.bloom) setBloom(false);
      else if (quality.tier > 0) setQuality(quality.tier - 1);
    } else if (running && quality.fps > 57 && quality.inferenceCost < 14 && width > 620) {
      if (quality.tier < 2) setQuality(quality.tier + 1);
      else setBloom(true);
    }
    quality.nextCheck = now + 2500; quality.samples.length = 0;
  }
  if (running) {
    // 短暂丢失冻结粒子；超过480ms取消抓取，不触发归位或五音。
    if (now - hand.lastSeen > 480 && hand.lastSeen !== -Infinity) {
      held = null; palm = null; hand.down = false; hand.armed = false; hand.hover = null;
      hand.gripAmount = 0; hand.intent = 0; hand.lastSeen = -Infinity;
      video.classList.add('visible');
    }
    if (now - lastInference >= 34 && video.readyState >= 2
      && video.videoWidth && video.currentTime !== lastVideoTime) {
      lastInference = now; lastVideoTime = video.currentTime;
      const inferenceStarted = performance.now();
      try {
        acceptHand(model.detectForVideo(video, now), now);
        const cost = performance.now() - inferenceStarted;
        quality.inferenceCost += (cost - quality.inferenceCost) * .22;
        // 推理一旦占用过长，立即让出粒子算力，不等帧率采样周期结束。
        if (quality.inferenceCost > 22 && quality.tier > 0) {
          setBloom(false); setQuality(quality.tier - 1);
          quality.nextCheck = now + 3500; quality.samples.length = 0;
        }
      }
      catch { stopCamera('手势识别中断，请重新开启体验。'); }
    }
    if (running) {
      app.classList.toggle('ready', hand.armed);
      setStatus(statusForFrame(now));
    }
  }
  const level = audio.level(dt, now); updateParticles(dt, level); draw();
  requestAnimationFrame(frame);
}
$('start').addEventListener('click', () => { if (!starting && !running) void startExperience(); });
$('pause').addEventListener('click', () => pauseExperience());
$('reset').addEventListener('click', () => {
  resetHand(); time = 0; feedbackUntil = 0;
  for (const g of groups) {
    g.placed = false; g.placing = 0; g.scale = 1; g.capture = 0; g.magnetic = 0;
    g.capturePoint.x = g.fu; g.capturePoint.y = g.fv;
    Object.assign(g, freeCenter(g));
  }
  updateProgress();
  setStatus(running ? '新一轮开始 · 请张开手掌' : '点击开启体验');
});
$('sound').addEventListener('click', () => audio.toggle().catch(() => {
  $('audio-note').textContent = '声音暂不可用，请暂停后重新开启体验。';
}));
$('music').addEventListener('click', () => {
  selectingMusic = true;
  $('music-file').click();
});
$('music-file').addEventListener('change', async event => {
  const file = event.target.files?.[0]; event.target.value = '';
  try {
    if (file) await audio.loadFile(file);
  } catch { $('audio-note').textContent = '音乐无法播放，当前声音状态未改变。'; }
  finally { selectingMusic = false; }
});
$('music-play').addEventListener('click', () => audio.toggleMusic().catch(() => {
  $('audio-note').textContent = '音乐无法播放，请重新选择文件。';
}));
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !selectingMusic && (running || starting)) pauseExperience();
});
window.addEventListener('focus', () => {
  // 某些浏览器在取消文件选择时不会触发 change，以窗口重新聚焦作为兜底。
  if (selectingMusic) setTimeout(() => { selectingMusic = false; }, 180);
});
window.addEventListener('pagehide', event => {
  pauseExperience();
  if (!event.persisted) {
    disposed = true; model?.close(); audio.dispose(); particleField.dispose(); composer.dispose?.(); renderer.dispose();
  }
});
const observer = new ResizeObserver(resize); observer.observe(stage);
window.addEventListener('resize', resize);
resetHand(); resize(); requestAnimationFrame(frame);
updateProgress();
</script>
